      notes: Benefit realisation is tracked monthly by Legal Operations.
  - id: INIT-09
    name: IT Helpdesk Voice Bot
    type: Conversational bot
    business_unit: Technology
    sponsor: {name: Hannah Becker, role: Chief Technology Officer}
    owner: {name: Noah Williams, role: Service Desk Manager}
    go_live: 2026-08-01
    licensed_users: 1200
    wau: [300, null, 420]          # week 2 was not reported (telephony export failed)
    cost: {setup: 25000, run: 9000}
    benefit: {start: 16000, end: 22000}
    planned_annual_benefit: 260000
    charter_format: pdf
    charter:
      objective: Answer common IT support calls (password resets, VPN, printer issues) with a voice bot and create tickets automatically for everything else.
      scope_in: [Service-desk phone line for all employees, Password reset with identity verification, Automatic ticket creation]
      scope_out: [Hardware procurement, Access requests that need manager approval]
