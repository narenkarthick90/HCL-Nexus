# Generated by generate_portfolio.py: every data-quality issue planted in data/raw/.
- id: DQ-01
  file: usage_weekly.csv
  initiative: all
  kind: metric_names
  description: 'Weekly active users is reported under three names: ''WAU'', ''weekly_active_users'', ''Active Users
    (7d)''.'
  expected_fix: Map all three to weekly_active_users (metric_map.yaml).
- id: DQ-02
  file: usage_weekly.csv
  initiative: INIT-05
  kind: wrong_metric
  description: A monthly-active-users row ('MAU') is mixed into the weekly feed.
  expected_fix: Exclude MAU rows; adoption uses weekly active users only.
- id: DQ-03
  file: usage_weekly.csv
  initiative: INIT-02
  kind: duplicate_row
  description: The latest-week row is duplicated.
  expected_fix: Drop exact duplicates.
- id: DQ-04
  file: usage_weekly.csv
  initiative: INIT-04, INIT-05, INIT-06, INIT-07
  kind: date_format
  description: week_start uses DD/MM/YYYY and '9 Nov 2026' formats besides ISO dates.
  expected_fix: Parse to ISO; DD/MM confirmed because every parsed date must be one of the 3 supplied weeks.
- id: DQ-05
  file: usage_weekly.csv
  initiative: INIT-03
  kind: id_format
  description: Initiative id written as 'init-03 ' (lower case, trailing space).
  expected_fix: Normalise ids to INIT-NN.
- id: DQ-06
  file: usage_weekly.csv
  initiative: INIT-05
  kind: outlier_typo
  description: Latest-week WAU is 4,350 with only 600 licences (an extra zero).
  expected_fix: WAU cannot exceed licensed users; divide by 10 when that restores a value within licences and within
    25% of the previous week.
- id: DQ-07
  file: usage_weekly.csv
  initiative: INIT-09
  kind: missing_value
  description: Week 2 usage is missing (failed telephony export).
  expected_fix: Leave missing; the metrics use only the first and latest week, so no metric changes.
