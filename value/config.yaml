# Governed cleaning and scorecard configuration. Changing anything here changes the scorecard,
# so every rule that uses it writes a change-log entry.

raw_files:
  register: initiatives.xlsx
  usage: usage_weekly.csv
  costs: costs.csv
  benefits: benefits.csv
  fx: fx_rates.csv

initiative_id:
  pattern: '^\s*init[\s_\-]*0*(\d+)\s*$'   # case-insensitive; normalised to INIT-NN
  format: 'INIT-{:02d}'

# Every name a source system uses for the same measure, mapped to one canonical metric.
metric_synonyms:
  weekly_active_users: [WAU, weekly_active_users, Active Users (7d), weekly active users]
# Measures that look similar but must NOT be used for the scorecard.
excluded_metrics:
  MAU: monthly active users; a 30-day measure, not comparable with weekly active users

dates:
  # Non-ISO day/month formats are read day-first (assumption A3); a usage date is only accepted when it lands
  # on one of the supplied reporting weeks.
  formats: ['%d/%m/%Y', '%d %b %Y', '%d-%b-%Y', '%d %B %Y']

outliers:
  wau_typo_divisor: 10           # an extra zero
  max_neighbour_change: 0.25     # the corrected value must be within 25% of the neighbouring week

currency:
  base: USD
  unit_multipliers: {USD: 1, kUSD: 1000}

status_rules:                    # brief section 4
  green: {adoption_min: 0.60, roi_gt: 0}
  red: {adoption_lt: 0.30, roi_lt: 0}
